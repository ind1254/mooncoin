name: Moonpaper

options:
  bundleIdPrefix: com.ind1254
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Moonpaper:
    type: application
    platform: iOS
    sources:
      - path: Moonpaper
        excludes:
          - Resources
          - Info.plist
    resources:
      - path: Moonpaper/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ind1254.moonpaper
        PRODUCT_NAME: Moonpaper
        INFOPLIST_FILE: Moonpaper/Info.plist
    scheme:
      testTargets:
        - MoonpaperTests

  MoonpaperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoonpaperTests
    dependencies:
      - target: Moonpaper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ind1254.moonpaper.tests
        GENERATE_INFOPLIST_FILE: YES
